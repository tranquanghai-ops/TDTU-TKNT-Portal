name: Deploy Preview Channel

# ────────────────────────────────────────────────────────────────────────────
# SKELETON — Preview channel deployments are DISABLED until:
#   1. Firebase Hosting preview channels are enabled for the project
#   2. FIREBASE_SERVICE_ACCOUNT_TDTU_TKNT secret is configured in repo settings
#
# To enable: change the trigger below from workflow_dispatch to pull_request
# and ensure the secret is set.
# ────────────────────────────────────────────────────────────────────────────

on:
  # Manual trigger only until configured
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual preview deploy"
        required: false
        default: "Manual preview test"

concurrency:
  group: deploy-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy to Firebase preview channel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secret
        env:
          HAS_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TDTU_TKNT != '' }}
        run: |
          if [ "$HAS_SECRET" != "true" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_TDTU_TKNT secret is not set."
            echo "Preview deploy skipped. See README for setup instructions."
            exit 0
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Validate registry
        run: npm run validate

      - name: Download enabled app artifacts
        run: |
          ENABLED=$(jq -r '[.apps[] | select(.enabled==true) | .id] | if length==0 then "none" else join(",") end' apps-registry.json)
          echo "Enabled apps: $ENABLED"
          if [ "$ENABLED" = "none" ]; then
            echo "No apps enabled — skipping artifact download."
          else
            mkdir -p build-artifacts
            jq -c '.apps[] | select(.enabled == true)' apps-registry.json | while read -r app; do
              REPO=$(echo "$app" | jq -r '.repo')
              VERSION=$(echo "$app" | jq -r '.version')
              ARTIFACT=$(echo "$app" | jq -r '.artifact')
              echo "Downloading $ARTIFACT for $REPO @ $VERSION..."
              gh release download "$VERSION" -R "$REPO" -p "$ARTIFACT" -D build-artifacts/ --clobber
            done
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build

      - name: Deploy to preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TDTU_TKNT }}
          projectId: tdtu-tknt
          channelId: preview-${{ github.run_id }}
          expires: 7d
