name: Validate Registry & Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate registry and dry-run build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Validate apps-registry.json
        run: npm run validate

      - name: Download immutable app artifacts
        run: |
          mkdir -p build-artifacts
          jq -c '.apps[] | select(.enabled == true)' apps-registry.json | while read -r app; do
            REPO=$(echo "$app" | jq -r '.repo')
            VERSION=$(echo "$app" | jq -r '.version')
            ARTIFACT=$(echo "$app" | jq -r '.artifact')
            gh release download "$VERSION" -R "$REPO" -p "$ARTIFACT" -D build-artifacts/ --clobber
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify artifacts and full build
        run: npm run build

      - name: Check build/ is gitignored
        run: |
          if git ls-files --error-unmatch build/ 2>/dev/null; then
            echo "ERROR: build/ should be gitignored but files in it are tracked." && exit 1
          else
            echo "OK: build/ is not tracked by git (correctly gitignored or doesn't exist)."
          fi

      - name: Summary
        if: always()
        run: |
          echo "### Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Registry: validated" >> $GITHUB_STEP_SUMMARY
          echo "- Immutable artifacts and full build: passed" >> $GITHUB_STEP_SUMMARY
